<script>
function b64ToBytes(b) {
  var s = atob(b);
  var a = new Uint8Array(s.length);
  for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a;
}
function bytesToB64(a) {
  var s = "";
  for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
  return btoa(s);
}
async function isvDeriveKey(pass, saltB64, iter) {
  var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass.trim()), "PBKDF2", false, ["deriveBits"]);
  var bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: b64ToBytes(saltB64), iterations: iter, hash: "SHA-256" }, km, 256);
  return bytesToB64(new Uint8Array(bits));
}
async function isvDecrypt(keyB64, ivB64, ctB64) {
  var key = await crypto.subtle.importKey("raw", b64ToBytes(keyB64), "AES-GCM", false, ["decrypt"]);
  var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(ivB64) }, key, b64ToBytes(ctB64));
  return new TextDecoder().decode(plain);
}

(async function () {
  var STORE_KEY = "invest-sim-view-key";
  var d = JSON.parse(document.getElementById("isv-data").textContent);
  var form = document.getElementById("isv-form");
  var input = document.getElementById("isv-pass");
  var remember = document.getElementById("isv-remember");
  var msg = document.getElementById("isv-msg");

  // 元の文書の読み込みが終わる前に書き換えると、Next.js のハイドレーションが崩れることがあるので待つ
  function loaded() {
    if (document.readyState === "complete") return Promise.resolve();
    return new Promise(function (resolve) { window.addEventListener("load", resolve); });
  }
  async function show(html) {
    await loaded();
    document.open();
    document.write(html);
    document.close();
  }
  async function tryKey(key) {
    try { return await isvDecrypt(key, d.iv, d.ct); } catch (e) { return null; }
  }

  var saved = null;
  try { saved = localStorage.getItem(STORE_KEY); } catch (e) {}
  if (saved) {
    var html = await tryKey(saved);
    if (html !== null) { show(html); return; }
  }

  form.hidden = false;
  input.focus();
  form.addEventListener("submit", async function (ev) {
    ev.preventDefault();
    msg.textContent = "確認中…";
    try {
      var key = await isvDeriveKey(input.value, d.salt, d.iter);
      var html = await tryKey(key);
      if (html === null) { msg.textContent = "パスワードが違います"; return; }
      if (remember.checked) { try { localStorage.setItem(STORE_KEY, key); } catch (e) {} }
      show(html);
    } catch (e) {
      msg.textContent = "この環境では復号できません（https で開いてください）";
    }
  });
})();
</script>
